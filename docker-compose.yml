services:
  backend:
    build:
      context: ./backend
    container_name: carbcap-backend
    environment:
      NODE_ENV: production
      PORT: 5000
    volumes:
      - carbcap-data:/app/data
    expose:
      - "5000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5000/api/factors').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./Frontend
    container_name: carbcap-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped

volumes:
  carbcap-data:
